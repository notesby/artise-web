# Artise: builds Artise for macOS and Windows from this commit, then starts each build once to check it.
#
# - By hand (Actions → Artise desktop → Run workflow) for a test build, versioned 0.0.1-dev.<run number>.
# - On a desktop-v<major>.<minor>.<patch> tag for a release build with that version.
# - On a pull request that changes this workflow or its scripts, so a change to the build is tried before merging.
#
# macOS is a universal .dmg and .zip, signed with Artise's Developer ID and notarized when the repository has
# Apple's secrets (APPLE_CSC_LINK, APPLE_CSC_KEY_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, set by
# tools/artise/mac_signing.py; see ARTISE.md), else unsigned, to try with right-click → Open. Windows is an unsigned
# x64 .zip to try on a PC and the Microsoft Store package (.appx, unsigned: the Store signs it). The builds are kept
# as this run's artifacts for 14 days.
#
# A release tag also publishes: a GitHub release (beta) with the .dmg, the .zip files and the macOS feed, and the
# beta channel's feed on the desktop-feeds branch, which Macs on "Recibir versiones de prueba" read
# (tools/artise/desktop_feed.py). Moving it to stable is artise-desktop-promote.yml, by hand, after the checklist.
# The Store package goes to Partner Center by hand, from this run's artifacts.
#
# The Store package's identity comes from Partner Center ("Product identity"), set as the repository variables
# STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME; without them it builds with placeholders,
# for checking only.
#
# It reuses the steps of Element's build_desktop_macos.yaml and build_desktop_windows.yaml, which stay disabled,
# but packages this commit's apps/web (artise/scripts/package-webapp.sh) instead of Element's release tarball.
name: Artise desktop

on:
    workflow_dispatch:
    push:
        tags: ["desktop-v*"]
    pull_request:
        paths:
            - .github/workflows/artise-desktop.yml
            - apps/desktop/artise/**
            - apps/desktop/playwright/e2e/artise/**

permissions:
    contents: read

concurrency:
    group: artise-desktop-${{ github.ref }}
    cancel-in-progress: true

jobs:
    webapp:
        name: Web app and unit tests
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Version
              id: version
              run: echo "version=$(apps/desktop/artise/scripts/version.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

            - uses: ./.github/actions/setup-node-pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Desktop unit tests
              working-directory: apps/desktop
              run: pnpm test:unit --run

            - name: Build the web app into webapp.asar
              run: apps/desktop/artise/scripts/package-webapp.sh
              env:
                  # Shown in Settings → Help & About, as on chat.<workspace>.
                  VERSION: ${{ steps.version.outputs.version }}
                  # The desktop project on crashes.artise.co; without it the build sends no crash reports.
                  ARTISE_DESKTOP_SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN }}

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: webapp
                  path: apps/desktop/webapp.asar
                  retention-days: 1
                  if-no-files-found: error

    macos:
        name: Build macOS universal
        needs: webapp
        runs-on: macos-26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: webapp
                  path: apps/desktop

            # Quartz draws the .dmg's badge icon
            # https://github.com/electron-userland/electron-builder/issues/9511#issuecomment-3774092888
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: "3.13"
            - run: sudo pip3 install pyobjc-framework-Quartz

            - uses: ./.github/actions/setup-node-pnpm

            # The prebuilt Seshat binaries for both architectures, for the universal build
            - name: Install optional dependencies for both architectures
              run: |
                  cat >> pnpm-workspace.yaml <<EOF

                  supportedArchitectures:
                      os: [current]
                      cpu: [x64, arm64]
                  EOF

            - name: Install
              working-directory: apps/desktop
              run: pnpm install --frozen-lockfile --filter element-desktop

            # Signed and notarized when the repository has all five of Apple's secrets; unsigned when it has none.
            # The API key goes to a file for notarytool; the certificate stays in the build step's own environment.
            - name: Apple's signing secrets
              id: apple
              env:
                  APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
                  APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
              run: |
                  missing=()
                  for name in APPLE_CSC_LINK APPLE_CSC_KEY_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
                      [ -n "${!name}" ] || missing+=("$name")
                  done
                  if [ "${#missing[@]}" -eq 5 ]; then
                      echo "signed=false" >> "$GITHUB_OUTPUT"
                      echo "::notice title=macOS::Unsigned build: the repository has no Apple signing secrets (ARTISE.md, Signing the Mac build)."
                      exit 0
                  elif [ "${#missing[@]}" -ne 0 ]; then
                      echo "::error title=macOS::Some of Apple's signing secrets are missing: ${missing[*]} (ARTISE.md, Signing the Mac build)."
                      exit 1
                  fi
                  key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
                  echo "$ASC_KEY_P8" | base64 --decode > "$key_path"
                  if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
                      echo "::error title=macOS::ASC_KEY_P8 isn't a base64-encoded .p8 key."
                      exit 1
                  fi
                  chmod 600 "$key_path"
                  echo "signed=true" >> "$GITHUB_OUTPUT"
                  echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
                  echo "APPLE_API_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
                  echo "APPLE_API_ISSUER=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

            - name: Prepare
              working-directory: apps/desktop
              run: |
                  pnpm exec tsc
                  node scripts/copy-res.ts

            # Two steps, as Element's workflow: electron-builder takes even an empty CSC_LINK as a certificate.
            - name: Build (signed and notarized)
              if: steps.apple.outputs.signed == 'true'
              working-directory: apps/desktop
              run: pnpm exec electron-builder --config artise/electron-builder.ts --universal --publish never --mac dmg zip
              env:
                  CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
                  VERSION: ${{ needs.webapp.outputs.version }}

            - name: Build (unsigned)
              if: steps.apple.outputs.signed != 'true'
              working-directory: apps/desktop
              run: pnpm exec electron-builder --config artise/electron-builder.ts --universal --publish never --mac dmg zip
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
                  VERSION: ${{ needs.webapp.outputs.version }}

            - name: Check the app is signed, notarized and stapled
              if: steps.apple.outputs.signed == 'true'
              working-directory: apps/desktop
              run: |
                  codesign --verify --deep --strict --verbose=2 dist/mac-universal/Artise.app
                  codesign -d --entitlements - dist/mac-universal/Artise.app | grep -q "com.apple.security.device.camera"
                  spctl -a -vvv -t install dist/mac-universal/Artise.app
                  xcrun stapler validate dist/mac-universal/Artise.app

            - name: Check the dmg and zip are there, and the app's permission texts
              working-directory: apps/desktop
              run: |
                  ls dist
                  test -f dist/Artise-*.dmg
                  test -f dist/Artise-*-mac.zip
                  for language in en es pt; do
                      test -f "dist/mac-universal/Artise.app/Contents/Resources/$language.lproj/InfoPlist.strings"
                  done
                  /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" dist/mac-universal/Artise.app/Contents/Info.plist

            # Not the unpacked app: the dmg and zip already hold it.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: artise-macos
                  path: |
                      apps/desktop/dist/*.dmg
                      apps/desktop/dist/*-mac.zip
                  retention-days: 14
                  if-no-files-found: error

    windows:
        name: Build Windows x64 (unsigned)
        needs: webapp
        runs-on: windows-2025
        steps:
            # nx needs LF line endings, https://github.com/nrwl/nx/issues/35828 (as Element's workflow)
            - name: Configure git line endings
              run: |
                  git config --system core.autocrlf false
                  git config --system core.eol lf

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: webapp
                  path: apps/desktop

            - uses: ./.github/actions/setup-node-pnpm

            - name: Install
              working-directory: apps/desktop
              run: pnpm install --frozen-lockfile --filter element-desktop

            - name: Build
              working-directory: apps/desktop
              shell: bash
              run: |
                  pnpm exec tsc
                  node scripts/copy-res.ts
                  # The Store package's tiles, where electron-builder looks for them.
                  mkdir -p build/appx
                  cp artise/icons/appx/*.png build/appx/
                  pnpm exec electron-builder --config artise/electron-builder.ts --x64 --publish never --win zip appx
              env:
                  VERSION: ${{ needs.webapp.outputs.version }}
                  ARTISE_STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
                  ARTISE_STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
                  ARTISE_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}

            - name: Check the zip and the Store package are there
              working-directory: apps/desktop
              shell: bash
              run: |
                  ls dist
                  test -f dist/win-unpacked/Artise.exe
                  test -f dist/Artise-*-win.zip
                  test -f dist/Artise*.appx

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: artise-windows-x64
                  path: apps/desktop/dist/*-win.zip
                  retention-days: 14
                  if-no-files-found: error

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: artise-windows-store
                  path: apps/desktop/dist/*.appx
                  retention-days: 14
                  if-no-files-found: error

    start-up:
        name: Start-up check on ${{ matrix.name }}
        needs: [macos, windows]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      runs-on: macos-15
                      artifact: artise-macos
                      # A mounted dmg is read-only, and the check turns a fuse back on, so copy the app out first.
                      prepare: |
                          hdiutil attach dist/*.dmg -mountpoint /Volumes/Artise
                          rsync -a /Volumes/Artise/Artise.app ~/Applications/
                          hdiutil detach /Volumes/Artise
                      executable: /Users/runner/Applications/Artise.app/Contents/MacOS/Artise
                    - name: Windows
                      runs-on: windows-2025
                      artifact: artise-windows-x64
                      prepare: unzip -q dist/*-win.zip -d dist/win-unpacked
                      executable: dist/win-unpacked/Artise.exe
        runs-on: ${{ matrix.runs-on }}
        defaults:
            run:
                shell: bash
                working-directory: apps/desktop
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup-node-pnpm

            - name: Install
              run: pnpm install --frozen-lockfile --filter element-desktop

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: ${{ matrix.artifact }}
                  path: apps/desktop/dist

            - name: Unpack the app
              run: ${{ matrix.prepare }}

            # The build turns the EnableNodeCliInspectArguments fuse off; Playwright needs it to drive Electron.
            # This copy is only for the check and is thrown away with the runner.
            - name: Let Playwright drive the app
              # From the desktop package's own bin folder, where @electron/fuses installs it. Changing the fuse
              # breaks a signed build's signature, so on macOS the copy is signed again ad hoc for this check.
              run: |
                  "$(pnpm bin)/electron-fuses" write --app "$EXECUTABLE" EnableNodeCliInspectArguments=on
                  if [ "$RUNNER_OS" = macOS ]; then
                      codesign --force --deep --sign - "$(dirname "$(dirname "$(dirname "$EXECUTABLE")")")"
                  fi
              env:
                  EXECUTABLE: ${{ matrix.executable }}

            - name: Start Artise
              timeout-minutes: 15
              run: pnpm exec playwright test playwright/e2e/artise --ignore-snapshots --reporter=line
              env:
                  ELEMENT_DESKTOP_EXECUTABLE: ${{ matrix.executable }}

            - name: Keep the test report
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: start-up-${{ matrix.artifact }}
                  path: apps/desktop/playwright/test-results
                  retention-days: 7

    release:
        name: Release to the beta channel
        if: github.ref_type == 'tag'
        needs: [webapp, start-up]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.webapp.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: artise-*
                  path: dist
                  merge-multiple: true

            # Every release has its what's-new note in en, es and pt (apps/desktop/artise/CHECKLIST.md).
            - name: The release note
              run: |
                  if [ ! -f "apps/desktop/artise/releases/$VERSION.md" ]; then
                      echo "::error title=Release::Write the what's-new note first: apps/desktop/artise/releases/$VERSION.md"
                      exit 1
                  fi

            - name: The macOS feed
              run: |
                  zip="$(basename dist/*-mac.zip)"
                  url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${zip// /%20}"
                  python3 tools/artise/desktop_feed.py releases-json --version "$VERSION" --url "$url" \
                      --notes-file "apps/desktop/artise/releases/$VERSION.md" > dist/releases.json
                  cat dist/releases.json

            # The Store package stays out: it's unsigned until the Store signs it, so nobody can install it from here.
            - name: Publish the GitHub release, as a pre-release until promoted
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" --prerelease --title "Artise $VERSION" \
                      --notes-file "apps/desktop/artise/releases/$VERSION.md" \
                      dist/*.dmg dist/*-mac.zip dist/*-win.zip dist/releases.json

            - name: Point the beta channel at it
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python3 tools/artise/desktop_feed.py --repo "$GITHUB_REPOSITORY" publish --channel beta dist/releases.json
