# Artise: build the web app image on every push to development (and on tags), publish it to
# ghcr.io/notesby/artise-web. The server pins it by digest (family-wiki deploy/docker-compose.yml).
# The upstream Element workflows in this folder are disabled in the repository settings.
name: Artise build

on:
  push:
    branches: [development]
    tags: ["artise-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: artise-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/notesby/artise-web:${{ github.ref_name }}
            ghcr.io/notesby/artise-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
