# Artise: moves a desktop release from the beta channel to stable, after the hand checklist
# (apps/desktop/artise/CHECKLIST.md). Nothing is rebuilt: the stable feed gets beta's file, and the GitHub release
# stops being a pre-release and becomes the latest (what the download link, releases/latest, points at).
#
# Actions → Artise desktop: promote → Run workflow, with the release's tag (desktop-v1.2.3).
name: "Artise desktop: promote"

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "The release to promote, desktop-v<major>.<minor>.<patch>"
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: artise-desktop-promote
    cancel-in-progress: false

jobs:
    promote:
        name: Beta to stable
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: The version
              id: version
              env:
                  TAG: ${{ inputs.tag }}
              run: echo "version=$(apps/desktop/artise/scripts/version.sh "$TAG" 0)" >> "$GITHUB_OUTPUT"

            - name: Copy beta's feed to stable
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: python3 tools/artise/desktop_feed.py --repo "$GITHUB_REPOSITORY" promote --version "$VERSION"

            - name: Make the release the latest
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
              run: gh release edit "$TAG" --prerelease=false --latest
